[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "monitoring"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["textual", "httpx"]

[project.scripts]
monitoring = "monitoring.__main__:main"

[tool.setuptools.packages.find]
include = ["monitoring*"]